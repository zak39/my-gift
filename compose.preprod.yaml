# Preprod: Caddy, installed on the server (its Caddyfile is kept out of this repository),
# holds the HTTPS certificate and hands the requests to FrankenPHP over plain HTTP on
# 127.0.0.1:9310: `reverse_proxy 127.0.0.1:9310` in the domain's site block.
#   `castor deploy preprod`: it checks out the latest tag and starts the containers.
# .env.preprod.local (out of git: copy .env.server.dist) sets APP_ENV=preprod: the « version de test » banner (Molecule:TestBanner),
# with prod's settings (the when@preprod blocks of config/packages; no debug, composer.json
# extra.runtime.prod_envs).
name: mygift

# Docker's default json-file driver never rotates: Monolog writes to stderr, so the logs would
# grow until the disk is full. The local driver rotates and compresses: 3 files of 10 MB at most.
x-logging: &logging
  driver: local
  options:
    max-size: "10m"
    max-file: "3"

services:
  php:
    build: .
    restart: always
    logging: *logging
    env_file: .env.preprod.local
    environment:
      # HTTP only: the proxy holds the certificate.
      SERVER_NAME: ":80"
      # The deployed tag, set by `castor deploy` (compose.prod.yaml says why not required).
      APP_VERSION: ${APP_VERSION:-dev}
      # Both must trust the proxy (compose.prod.yaml says why).
      CADDY_GLOBAL_OPTIONS: |
        servers {
          trusted_proxies static private_ranges
        }
      SYMFONY_TRUSTED_PROXIES: private_ranges
    ports:
      - "127.0.0.1:9310:80"
    volumes:
      - .:/app
    depends_on:
      database:
        condition: service_healthy

  messenger-worker:
    build: .
    restart: always
    logging: *logging
    env_file: .env.preprod.local
    # The async queue (emails, avatars) and the scheduler (the inactive account purge).
    # --memory-limit stays below PHP's memory_limit (256M, Dockerfile): Messenger stops between
    # two messages, before PHP kills it in the middle of one.
    command: php bin/console messenger:consume async scheduler_default --time-limit=3600 --memory-limit=192M
    # The image's own check asks Caddy, which this container does not run: always "unhealthy".
    healthcheck:
      disable: true
    volumes:
      - .:/app
    depends_on:
      database:
        condition: service_healthy

  database:
    image: postgres:16-alpine
    restart: always
    logging: *logging
    env_file: .env.preprod.local
    # php and the worker wait for it (depends_on): migrations and the queue need a ready
    # database, not just a started container. $$ leaves the variables to the container's
    # shell, which has them from the env_file.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 60s
    volumes:
      - database_data:/var/lib/postgresql/data

volumes:
  database_data:
