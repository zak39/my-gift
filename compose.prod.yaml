# Production: Caddy, installed on the server (its Caddyfile is kept out of this repository),
# holds the HTTPS certificate and hands the requests to FrankenPHP over plain HTTP on
# 127.0.0.1:9320: `reverse_proxy 127.0.0.1:9320` in the domain's site block. The preprod is
# set up the same way (compose.preprod.yaml), on 127.0.0.1:9310, but never on the same server:
# both are the compose project "mygift", so they would share containers and volumes.
# .env.prod.local (out of git: copy .env.server.dist, which lists every variable the server
# must give) sets APP_ENV=prod.
#   `castor deploy prod`: it checks out the latest tag and starts the containers.
name: mygift

# Docker's default json-file driver never rotates: Monolog writes to stderr, so the logs would
# grow until the disk is full. The local driver rotates and compresses: 3 files of 10 MB at most.
x-logging: &logging
  driver: local
  options:
    max-size: "10m"
    max-file: "3"

services:
  php:
    build: .
    restart: always
    logging: *logging
    env_file: .env.prod.local
    environment:
      # HTTP only: the proxy holds the certificate.
      SERVER_NAME: ":80"
      # The deployed tag, set by `castor deploy`. Not required (${APP_VERSION:?}): compose
      # would then refuse every command without it, logs and exec included.
      APP_VERSION: ${APP_VERSION:-dev}
      # Both must trust the proxy, or the X-Forwarded-Proto it sends is ignored: PHP then
      # believes the request is plain HTTP, and the login redirects to http://, which Turbo's
      # fetch() refuses from an HTTPS page. The proxy reaches the container through Docker's
      # bridge (a private address); the port is bound to 127.0.0.1, so nobody else does.
      CADDY_GLOBAL_OPTIONS: |
        servers {
          trusted_proxies static private_ranges
        }
      SYMFONY_TRUSTED_PROXIES: private_ranges
    ports:
      - "127.0.0.1:9320:80"
    volumes:
      - .:/app
    depends_on:
      database:
        condition: service_healthy

  messenger-worker:
    build: .
    restart: always
    logging: *logging
    env_file: .env.prod.local
    # The async queue (emails, avatars) and the scheduler (the inactive account purge).
    # --memory-limit stays below PHP's memory_limit (256M, Dockerfile): Messenger stops between
    # two messages, before PHP kills it in the middle of one.
    command: php bin/console messenger:consume async scheduler_default --time-limit=3600 --memory-limit=192M
    # The image's own check asks Caddy, which this container does not run: always "unhealthy".
    healthcheck:
      disable: true
    volumes:
      - .:/app
    depends_on:
      database:
        condition: service_healthy

  database:
    image: postgres:16-alpine
    restart: always
    logging: *logging
    env_file: .env.prod.local
    # php and the worker wait for it (depends_on): migrations and the queue need a ready
    # database, not just a started container. $$ leaves the variables to the container's
    # shell, which has them from the env_file.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 60s
    volumes:
      - database_data:/var/lib/postgresql/data

volumes:
  database_data:
