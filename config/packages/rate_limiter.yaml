framework:
    rate_limiter:
        # Re-entering one's password to change it or to delete the account: a session left
        # open on someone else's computer must not let them guess it. Per user, shared by
        # both forms through App\Services\Security\CheckCurrentPassword.
        password_check:
            policy: 'fixed_window'
            limit: 5
            interval: '15 minutes'
        # A new confirmation email asked from the login page (ResendEmailConfirmation): per
        # caller's IP, so that nobody floods inboxes with it. Not per address: anyone could
        # then use up a victim's allowance.
        verify_email_resend:
            policy: 'fixed_window'
            limit: 5
            interval: '1 hour'
        # The email of a friend request (FriendNotificationSubscriber), per sender and
        # recipient: send, cancel and send again would otherwise flood the recipient's inbox.
        # The requests themselves are not limited, only their email.
        friend_request_email:
            policy: 'fixed_window'
            limit: 1
            interval: '1 day'
        # Invitation links missed (App\Services\Friend\FindInvitation), per caller's IP: a
        # chosen slug may be a word, and guessing must stay slow. Only the misses count, so
        # that a messenger's bot unfolding real links, one IP for many users, is not stopped.
        invitation_lookup:
            policy: 'fixed_window'
            limit: 20
            interval: '1 hour'
        # The slugs a user tries for their own link (App\Services\Friend\CheckInvitationSlugAttempt),
        # per user: the form tells a slug in use, as a link opened does.
        invitation_slug_change:
            policy: 'fixed_window'
            limit: 10
            interval: '1 hour'
