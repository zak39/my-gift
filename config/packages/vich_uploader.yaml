vich_uploader:
    db_driver: orm

    mappings:
        imageGift:
            uri_prefix: /data
            upload_destination: '%kernel.project_dir%/public/data'
            namer: Vich\UploaderBundle\Naming\SmartUniqueNamer
            directory_namer: App\Vich\UserGiftDirectoryNamer
        avatar:
            uri_prefix: /data
            upload_destination: '%kernel.project_dir%/public/data'
            namer: Vich\UploaderBundle\Naming\SmartUniqueNamer
            directory_namer: App\Vich\UserAvatarDirectoryNamer
