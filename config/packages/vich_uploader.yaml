vich_uploader:
    db_driver: orm

    mappings:
        imageGift:
            uri_prefix: /data
            upload_destination: '%app.data_dir%'
            namer: Vich\UploaderBundle\Naming\SmartUniqueNamer
            directory_namer: App\Vich\GiftDirectoryNamer
        avatar:
            uri_prefix: /data
            upload_destination: '%app.data_dir%'
            namer: Vich\UploaderBundle\Naming\SmartUniqueNamer
            directory_namer: App\Vich\UserAvatarDirectoryNamer
