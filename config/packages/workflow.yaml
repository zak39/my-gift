framework:
    workflows:
        gift_request:
            type: 'state_machine'
            audit_trail:
                enabled: true
            marking_store:
                type: 'method'
                property: 'status'
            supports:
                - App\Entity\Gift
            initial_marking: !php/enum App\Enum\GiftStatus::CREATED
            places: !php/enum App\Enum\GiftStatus
            transitions:
                reserve:
                    from: !php/enum App\Enum\GiftStatus::CREATED
                    to: !php/enum App\Enum\GiftStatus::RESERVED
                contribute:
                    from: !php/enum App\Enum\GiftStatus::CREATED
                    to: !php/enum App\Enum\GiftStatus::CONTRIBUTING
                disengage:
                    from: !php/enum App\Enum\GiftStatus::RESERVED
                    to: !php/enum App\Enum\GiftStatus::CREATED
                cancelled_contribution:
                    from: !php/enum App\Enum\GiftStatus::CONTRIBUTING
                    to: !php/enum App\Enum\GiftStatus::CREATED
                finalize:
                    # A reservation is ready whenever its giver says so; a pool once it is complete.
                    guard: "not subject.getStatus().isPoolOpen() or subject.getPool().isComplete()"
                    from:
                        - !php/enum App\Enum\GiftStatus::RESERVED
                        - !php/enum App\Enum\GiftStatus::CONTRIBUTING
                    to: !php/enum App\Enum\GiftStatus::READY
                reopen:
                    from: !php/enum App\Enum\GiftStatus::READY
                    to: !php/enum App\Enum\GiftStatus::CONTRIBUTING
                release:
                    # A reservation declared ready whose giver deletes their account
                    # (ReadyReservationRelease): no button offers it.
                    from: !php/enum App\Enum\GiftStatus::READY
                    to: !php/enum App\Enum\GiftStatus::CREATED
                give:
                    from: !php/enum App\Enum\GiftStatus::READY
                    to: !php/enum App\Enum\GiftStatus::GIVEN
                archive:
                    from: !php/enum App\Enum\GiftStatus::GIVEN
                    to: !php/enum App\Enum\GiftStatus::ARCHIVED
        friend_request:
            type: 'state_machine'
            audit_trail:
                enabled: true
            marking_store:
                type: 'method'
                property: 'status'
            supports:
                - App\Entity\FriendRequest
            initial_marking: !php/enum App\Enum\FriendRequestStatus::PENDING
            places: !php/enum App\Enum\FriendRequestStatus
            transitions:
                accept:
                    guard: "is_granted('friend_request.answer', subject)"
                    from: !php/enum App\Enum\FriendRequestStatus::PENDING
                    to: !php/enum App\Enum\FriendRequestStatus::ACCEPTED
                refuse:
                    guard: "is_granted('friend_request.answer', subject)"
                    from: !php/enum App\Enum\FriendRequestStatus::PENDING
                    to: !php/enum App\Enum\FriendRequestStatus::ENDED
                cancel:
                    guard: "is_granted('friend_request.cancel', subject)"
                    from: !php/enum App\Enum\FriendRequestStatus::PENDING
                    to: !php/enum App\Enum\FriendRequestStatus::ENDED
        crew_invitation:
            type: 'state_machine'
            audit_trail:
                enabled: true
            marking_store:
                type: 'method'
                property: 'status'
            supports:
                - App\Entity\CrewInvitation
            initial_marking: !php/enum App\Enum\CrewInvitationStatus::PENDING
            places: !php/enum App\Enum\CrewInvitationStatus
            transitions:
                accept:
                    guard: "is_granted('crew_invitation.answer', subject)"
                    from: !php/enum App\Enum\CrewInvitationStatus::PENDING
                    to: !php/enum App\Enum\CrewInvitationStatus::ACCEPTED
                refuse:
                    guard: "is_granted('crew_invitation.answer', subject)"
                    from: !php/enum App\Enum\CrewInvitationStatus::PENDING
                    to: !php/enum App\Enum\CrewInvitationStatus::ENDED
                cancel:
                    guard: "is_granted('crew_invitation.cancel', subject)"
                    from: !php/enum App\Enum\CrewInvitationStatus::PENDING
                    to: !php/enum App\Enum\CrewInvitationStatus::ENDED
