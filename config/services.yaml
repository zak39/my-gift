# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    # Where Vich stores the uploads (config/packages/vich_uploader.yaml): users/{id}/ for an
    # account's images, crews/{id}/ for a crew's gift images (App\Vich\GiftDirectoryNamer).
    app.data_dir: '%kernel.project_dir%/public/data'

    # Inactive accounts (App\Services\Retention\AccountRetention), ISO 8601 durations: a
    # warning after 12 months without activity, the deletion one month later, a reminder
    # 7 days before. Accounts never verified go after 30 days, unwarned.
    app.retention.warn_after: 'P12M'
    app.retention.notice: 'P1M'
    app.retention.remind_before: 'P7D'
    app.retention.unverified_after: 'P30D'

    # Who makes the app and how to reach them: the footer, the « À propos » page and modal,
    # the legal pages, all through the `site` Twig global (config/packages/twig.yaml).
    # « dev » unless `castor deploy` sets APP_VERSION to the tag it deploys (compose.*.yaml).
    env(APP_VERSION): 'dev'
    app.version: '%env(APP_VERSION)%'
    app.author_name: 'zakode'
    app.linkedin_url: 'https://www.linkedin.com/in/baptiste-fotia'
    app.repository_url: 'https://github.com/zak39/my-gift'
    app.contact_email: 'zakode.dev@gmail.com'
    # The From of every email (config/packages/mailer.yaml), a mailbox that does not exist:
    # replies bounce, people write through the contact links. An address of the Mailgun
    # domain, or SPF and DKIM no longer match it and the emails land in spam.
    app.sender_email: 'noreply@zakode.dev'
    app.support_url: 'https://buymeacoffee.com/zakode'
    # The app in two sentences: its own link card (LinkPreviewBuilder::forApp()), and the
    # meta description of a page without its own (base.html.twig).
    app.description: 'Créez une section par occasion, partagez le lien. Vos proches réservent un cadeau ou cagnottent ensemble, sans jamais se marcher dessus.'
    # The host the legal notice must name (LCEN, art. 6): name, address and phone.
    app.host:
        name: 'Moji'
        address: '189, rue de Suresnes - 92000 Nanterre'
        mail: 'contact@moji.fr'
        phone: '01.85.09.01.90'

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones

    # For URLs a user pastes, the product page (ProductPageReader) and its image
    # (ImageDownloader): private and loopback addresses are refused, redirects included,
    # or the server could be made to request its own network (SSRF)
    app.public_http_client:
        class: Symfony\Component\HttpClient\NoPrivateNetworkHttpClient
        arguments: ['@http_client']

when@dev:
    services:
        # A product page served locally may be pasted to try out the prefill
        app.public_http_client: '@http_client'
